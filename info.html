<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uandra Andrade - Informações</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a2e;
            --gold: #c8956c;
            --gold-light: #d4a574;
            --green: #3d5a3c;
            --green-hover: #2f4630;
            --white: #ffffff;
            --bg: #f3f1ee;
            --transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        .header {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 14px 30px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 30px rgba(0,0,0,0.04); position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        .back-btn { display: flex; align-items: center; gap: 6px; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 14px; padding: 8px 14px; border-radius: 25px; transition: var(--transition); }
        .back-btn:hover { color: var(--gold); background: rgba(200,149,108,0.06); }
        .logo-center { position: absolute; left: 50%; transform: translateX(-50%); }
        .logo-center img { height: 55px; object-fit: contain; transition: var(--transition); }
        .logo-center:hover img { transform: scale(1.03); }
        .header { position: relative; }

        .icon-btn {
            width: 40px; height: 40px; border: none; background: #f5f5f5; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); position: relative;
        }
        .icon-btn i { font-size: 17px; color: var(--primary); transition: var(--transition); }
        .icon-btn:hover { background: var(--gold); transform: scale(1.05); }
        .icon-btn:hover i { color: white; }
        .cart-badge {
            position: absolute; top: -6px; right: -6px; background: var(--green); color: white;
            width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; border: 2px solid white;
            box-shadow: 0 3px 10px rgba(61,90,60,0.3);
        }

        .main-container { max-width: 1300px; margin: 95px auto 30px; padding: 0 22px; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-bottom: 30px; }
        .info-card {
            position: relative; border-radius: 28px; overflow: hidden; cursor: pointer;
            min-height: 380px; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }
        .info-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26,26,46,0.40);
            transition: var(--transition);
        }
        .info-card:hover { transform: scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .info-card:hover::before { background: rgba(26,26,46,0.30); }
        .info-card-content {
            position: relative; z-index: 2; text-align: center; color: white; padding: 30px 24px; max-width: 500px;
        }
        .info-card-content h3 { font-size: 26px; font-weight: 700; margin-bottom: 10px; letter-spacing: -1px; }
        .info-card-content p { font-size: 15px; opacity: 0.9; line-height: 1.6; }

        .detail-section { display: none; }
        .detail-section.active { display: block; }
        .detail-content { max-width: 850px; margin: 0 auto; padding: 10px 0 40px; }
        .detail-content .detail-image { width: 100%; border-radius: 24px; margin-bottom: 28px; object-fit: cover; max-height: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .detail-content h2 { font-size: 30px; font-weight: 700; color: var(--primary); margin-bottom: 14px; letter-spacing: -1px; }
        .detail-content .detail-brief { font-size: 16px; color: var(--gold); margin-bottom: 22px; font-weight: 500; line-height: 1.7; }
        .detail-content .detail-full { font-size: 15px; color: #444; line-height: 2; white-space: pre-wrap; }
        .detail-back-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px;
            background: var(--green); color: white; border: none; border-radius: 50px;
            font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 28px;
            text-transform: uppercase; letter-spacing: 1px; transition: var(--transition);
        }
        .detail-back-btn:hover { background: var(--green-hover); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(61,90,60,0.2); }

        .cart-sidebar { position: fixed; top: 0; right: -460px; width: 460px; height: 100vh; background: white; box-shadow: -15px 0 50px rgba(0,0,0,0.06); transition: right var(--transition); z-index: 3000; display: flex; flex-direction: column; border-radius: 28px 0 0 28px; }
        .cart-sidebar.active { right: 0; }
        .cart-header { padding: 24px; border-bottom: 1px solid #f0ede8; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h3 { font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .close-cart { background: none; border: none; font-size: 22px; cursor: pointer; color: #666; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .close-cart:hover { background: #f0f0f0; color: var(--primary); }
        .cart-items { flex: 1; overflow-y: auto; padding: 18px; }
        .cart-item { display: flex; gap: 16px; padding: 16px; background: #faf8f6; border-radius: 18px; margin-bottom: 12px; align-items: center; }
        .cart-item-image { width: 62px; height: 80px; object-fit: cover; border-radius: 14px; }
        .cart-item-details { flex: 1; }
        .cart-item-title { font-weight: 600; color: var(--primary); font-size: 14px; margin-bottom: 4px; }
        .cart-item-variant { font-size: 12px; color: #888; }
        .cart-item-price { color: var(--gold); font-weight: 700; font-size: 15px; margin-top: 4px; }
        .remove-item { background: none; border: none; color: #bbb; cursor: pointer; padding: 8px; transition: var(--transition); }
        .remove-item:hover { color: #e94560; transform: scale(1.1); }
        .cart-footer { padding: 24px; border-top: 2px solid #f0ede8; }
        .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 17px; }
        .cart-total span:last-child { font-size: 24px; font-weight: 700; color: var(--gold); }
        .checkout-button { width: 100%; padding: 16px; background: var(--green); color: white; border: none; border-radius: 50px; font-size: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: var(--transition); }
        .checkout-button:hover { background: var(--green-hover); box-shadow: 0 12px 30px rgba(61,90,60,0.2); transform: translateY(-2px); }

        .footer { background: var(--white); color: var(--primary); padding: 55px 30px 28px; margin-top: 70px; border-radius: 50px 50px 0 0; box-shadow: 0 -5px 30px rgba(0,0,0,0.04); }
        .footer-content { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        .footer-column h4 { font-size: 16px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid var(--gold); display: inline-block; }
        .footer-column p, .footer-column a { color: #666; text-decoration: none; display: block; margin-bottom: 10px; font-size: 13px; transition: var(--transition); }
        .footer-column a:hover { color: var(--gold); }
        .footer-payment { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .payment-icon {
            display: flex; align-items: center; gap: 6px; padding: 8px 14px;
            background: #f5f5f5; border-radius: 25px; font-size: 12px; color: #555; font-weight: 500;
            transition: var(--transition);
        }
        .payment-icon i { font-size: 16px; }
        .payment-icon .pix-icon { color: #00b8a9; }
        .payment-icon .card-icon { color: #1565c0; }
        .payment-icon .boleto-icon { color: #e65100; }
        .payment-icon:hover { background: #eee; transform: translateY(-2px); }
        .footer-bottom { text-align: center; padding-top: 28px; margin-top: 28px; border-top: 1px solid #f0ede8; color: #999; font-size: 12px; }
        .security-badge { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 14px; color: #999; font-size: 12px; }
        .security-badge i { color: var(--green); }

        @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } .info-card { min-height: 300px; } .info-card-content h3 { font-size: 22px; } .detail-content h2 { font-size: 24px; } }
        @media (max-width: 640px) { .header { padding: 10px 14px; } .logo-center { position: static; transform: none; } .cart-sidebar { width: 100%; right: -100%; border-radius: 0; } .footer-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar</a>
        <a href="index.html" class="logo-center"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj60jjuQ_0EAWlH5fEDfFI0_Auf55PjoMG0VjpNvJG1J3mUPoxtjnetS_J6zeB8G5mKNj6c0IH-UboT_jSNl2pFSzqMWqDvF-IxhJdVu5h9O2wXwyHx_SzOn7OEZcU8E3ta80tcPKS79i-mzOlcT5ycDEp_Hiz9WphJbtnDsw5dzdzDMVvUcnha6m37xY4/s2409/E4C9BE77-72F4-409A-B4B7-8927274CE292.png" alt="Logo"></a>
        <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cartCount">0</span></button>
    </header>

    <div class="main-container">
        <div class="info-grid" id="infoGrid"></div>
        <div class="detail-section" id="detailSection"></div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header"><h3><i class="fas fa-shopping-bag"></i> Sacola</h3><button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button></div>
        <div class="cart-items" id="cartItems"><p style="text-align:center;color:#999;padding:40px;">Sua sacola esta vazia</p></div>
        <div class="cart-footer"><div class="cart-total"><span>Total:</span><span id="cartTotal">R$ 0,00</span></div><button class="checkout-button" onclick="checkout()">Finalizar Compra <i class="fas fa-arrow-right"></i></button></div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-column"><h4>Institucional</h4><a href="info.html">Sobre Nos</a><a href="info.html">Politica de Privacidade</a><a href="info.html">Termos de Uso</a></div>
            <div class="footer-column"><h4>Contato</h4><p><i class="fas fa-map-marker-alt"></i> Mussurunga, Rotula do Setor C</p><p><i class="fas fa-phone"></i> (83) 99980-0154</p><p><i class="fas fa-envelope"></i> contato@uandrandrade.com.br</p></div>
            <div class="footer-column">
                <h4>Formas de Pagamento</h4>
                <div class="footer-payment">
                    <span class="payment-icon"><i class="fas fa-qrcode pix-icon"></i> Pix</span>
                    <span class="payment-icon"><i class="fas fa-credit-card card-icon"></i> Cartao</span>
                    <span class="payment-icon"><i class="fas fa-barcode boleto-icon"></i> Boleto</span>
                </div>
            </div>
        </div>

        <div class="footer-bottom"><div class="security-badge"><i class="fas fa-lock"></i><span>Ambiente seguro</span><i class="fas fa-shield-alt"></i></div><p style="margin-top:10px;">&copy; 2026 - Todos os direitos reservados.</p></div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig={apiKey:"AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",databaseURL:"https://san7-brasil-default-rtdb.firebaseio.com",projectId:"san7-brasil",authDomain:"san7-brasil.firebaseapp.com"};
        firebase.initializeApp(firebaseConfig);const database=firebase.database();
        let cart=JSON.parse(localStorage.getItem('cart'))||[],currentUser=JSON.parse(localStorage.getItem('currentUser'))||null;

        function loadInfos(){
            database.ref('infos').on('value',(snap)=>{
                const infos=snap.val();const grid=document.getElementById('infoGrid');
                if(infos){
                    const arr=Object.entries(infos).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
                    grid.innerHTML=arr.map(([id,info])=>`
                        <div class="info-card" style="background-image:url('${info.image||'https://via.placeholder.com/600x400/1a1a2e/1a1a2e'}');" onclick="openDetail('${id}')">
                            <div class="info-card-content">
                                <h3>${info.title||'Sem titulo'}</h3>
                                <p>${info.brief||''}</p>
                            </div>
                        </div>
                    `).join('');
                }else{
                    grid.innerHTML='<p style="text-align:center;color:#999;grid-column:1/-1;padding:40px;">Nenhuma informacao cadastrada.</p>';
                }
            });
        }

        function openDetail(id){
            database.ref(`infos/${id}`).once('value',(snap)=>{
                const info=snap.val();
                if(info){
                    document.getElementById('infoGrid').style.display='none';
                    const section=document.getElementById('detailSection');
                    section.classList.add('active');
                    section.innerHTML=`
                        <div class="detail-content">
                            ${info.image?`<img src="${info.image}" class="detail-image" onerror="this.src='https://via.placeholder.com/800x400/f5f5f5/c8956c'">`:''}
                            <h2>${info.title||'Sem titulo'}</h2>
                            <div class="detail-brief">${info.brief||''}</div>
                            <div class="detail-full">${info.fullText||''}</div>
                            <button class="detail-back-btn" onclick="closeDetail()"><i class="fas fa-arrow-left"></i> Voltar</button>
                        </div>
                    `;
                    window.scrollTo({top:100,behavior:'smooth'});
                }
            });
        }

        function closeDetail(){
            document.getElementById('infoGrid').style.display='grid';
            document.getElementById('detailSection').classList.remove('active');
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function toggleCart(){document.getElementById('cartSidebar').classList.toggle('active');updateCartUI();}
        function updateCartUI(){document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+(i.quantity||1),0);const d=document.getElementById('cartItems');let t=0;if(cart.length===0)d.innerHTML='<p style="text-align:center;color:#999;padding:40px;">Sua sacola esta vazia</p>';else{d.innerHTML=cart.map((item,i)=>{t+=item.price*(item.quantity||1);return`<div class="cart-item"><img src="${item.image||'https://via.placeholder.com/62x80'}" class="cart-item-image"><div class="cart-item-details"><div class="cart-item-title">${item.title}</div><div class="cart-item-variant">${item.variantName?`Variacao: ${item.variantName}`:`Tamanho: ${item.size}`}${item.color?' | Cor: '+item.color:''}</div><div class="cart-item-price">R$ ${item.price.toFixed(2)}</div></div><button class="remove-item" onclick="removeFromCart(${i})"><i class="fas fa-trash-alt"></i></button></div>`;}).join('');}document.getElementById('cartTotal').textContent=`R$ ${t.toFixed(2)}`;localStorage.setItem('cart',JSON.stringify(cart));}
        function removeFromCart(i){cart.splice(i,1);updateCartUI();}
        function checkout(){if(cart.length===0){alert('Sacola vazia!');return;}if(!currentUser){localStorage.setItem('redirectAfterLogin','checkout.html');window.location.href='index.html';return;}window.location.href='checkout.html';}

        loadInfos();updateCartUI();
    </script>
</body>
</html>
